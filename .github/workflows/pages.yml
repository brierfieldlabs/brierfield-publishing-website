name: Site CI and Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brierfield-publishing-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate
    runs-on: [self-hosted, Linux, X64, brierfield, normal-ci, github]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build site
        run: npm run build

      - name: Validate site
        run: npm run check

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: [self-hosted, Linux, X64, brierfield, normal-ci, github]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5