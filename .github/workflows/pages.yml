name: Site CI and Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, brierfield, normal-ci, github]
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Validate static site
        run: python3 scripts/validate-site.py

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: [self-hosted, Linux, X64, brierfield, normal-ci, github]
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4